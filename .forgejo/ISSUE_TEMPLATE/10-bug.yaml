name: Bug report
description: Viewer bug report
labels: [bug, triage]
body:
- type: markdown
  attributes:
    value: |
      - Write a descriptive bug title above.
      - Search [open bugs](https://git.slipstreamviewer.org/sky_line/Slipstream/issues?state=open&labels=11) to check it hasn't already been reported.
      - Crashed? Help > Report Bug in the viewer attaches your logs and system details for you.

- type: textarea
  attributes:
    label: Environment
    description: "Copy the info from the viewer's Help > About Slipstream window and paste it here:"
    placeholder: 'ex. Slipstream Beta 1.3.0.7 (64bit) ...'
  validations:
    required: true

- type: textarea
  attributes:
    label: Description
    description: Explain the problem.
  validations:
    required: true

- type: textarea
  attributes:
    label: Reproduction steps
    description: Steps to reproduce this bug
    placeholder: |
      1. First step
      2. Second step
      Expected: ...
      Actual: ...
  validations:
    required: true
