name: Feature request
description: New feature or enhancement
title: "[Feature]: "
labels: [feature, triage]
body:
- type: markdown
  attributes:
    value: |
      - Write a descriptive feature title above.
      - Search [open feature requests](https://git.slipstreamviewer.org/sky_line/Slipstream/issues?state=open&labels=13) to check it hasn't already been requested.

- type: textarea
  attributes:
    label: Environment
    description: "Copy the info from the viewer's Help > About Slipstream window and paste it here:"
    placeholder: 'ex. Slipstream Beta 1.3.0.7 (64bit) ...'
  validations:
    required: true

- type: textarea
  attributes:
    label: Description
    description: What does this feature do? Why is it needed? Include screenshots to show how it should work if you can.
  validations:
    required: true
