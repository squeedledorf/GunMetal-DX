# Slipstream Viewer pacman repository, betas and releases (vX.Y.Z-beta.N and vX.Y.Z).
# Append this to /etc/pacman.conf, after importing the signing key:
#   see @PACMAN_URL@/ or https://slipstreamviewer.org/wiki/install/
# Enable this section OR [slipstream], not both: they ship the same package.
[slipstream-beta]
SigLevel = Required DatabaseRequired TrustedOnly
Server = @PACMAN_URL@/$repo/os/$arch
