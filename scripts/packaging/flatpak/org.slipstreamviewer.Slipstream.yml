# Slipstream Viewer Flatpak (#286).
#
# Repackages the official Linux release tarball: the same binary as
# Slipstream_<ver>_x86_64.tar.xz, nothing is rebuilt. build_flatpak.sh stages
# this manifest in a work directory next to:
#   slipstream.tar.xz                              the release tarball
#   org.slipstreamviewer.Slipstream.metainfo.xml   generated by gen_metainfo.sh
#                                                  (releases from the git tags)
# and runs flatpak-builder on it. Don't run flatpak-builder on this directory
# directly; use build_flatpak.sh (see INFRA.md, "Building by hand").
#
# Runtime: freedesktop 25.08 (glibc 2.42, libstdc++ from GCC 15). The tarball
# needs glibc >= 2.38 / GLIBCXX_3.4.32, and every library its 64-bit ELF files
# link is in the Platform except libvlc (the VLC media plugin, unused: in-world
# media goes through GStreamer, mime_types_linux.xml), so nothing extra is
# bundled. build_flatpak.sh re-checks this against the Platform after every
# build (ldd inside the runtime) and fails on a missing library, so bumping
# runtime-version is safe to try. The GL extension (Mesa / NVIDIA, which also
# carries the Vulkan ICDs) and codecs-extra (H.264/AAC for GStreamer) are
# extensions the Platform itself declares; flatpak installs them on demand.
id: org.slipstreamviewer.Slipstream
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: slipstream
separate-locales: false

finish-args:
  # Display: native Wayland, X11 only when there is no Wayland session.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # GPU (Vulkan through the GL extension's ICDs).
  - --device=dri
  # Game controllers / 3D mice through SDL (flatpak >= 1.15.6; older flatpak
  # ignores the unknown device type).
  - --device=input
  - --share=network
  # Audio: OpenAL, WebRTC voice and SDL use PulseAudio (PipeWire's pulse
  # server on modern desktops); the PipeWire socket for SDL's native backend.
  - --socket=pulseaudio
  - --filesystem=xdg-run/pipewire-0
  # User data stays where the tarball keeps it (~/.slipstreamviewer, from the
  # passwd home in lldir_linux.cpp). --persist maps it to
  # ~/.var/app/org.slipstreamviewer.Slipstream/.slipstreamviewer, so paths in
  # logs and settings match the tarball and nothing outside ~/.var/app is
  # writable. INFRA.md "Data directory" explains the choice.
  - --persist=.slipstreamviewer
  # Viewer import (slviewerimportcore.cpp findSourceViewers): read-only access
  # to the other viewers' data directories. Import only writes into our own
  # directory (backups are made next to the destination file).
  - --filesystem=~/.firestorm_x64:ro
  - --filesystem=~/.firestorm:ro
  - --filesystem=~/.secondlife:ro
  - --filesystem=~/.alchemyviewer:ro
  - --filesystem=~/.alchemynext:ro
  - --filesystem=~/.blackdragon:ro
  # secondlife:// links: a second launch hands the SLURL to the running viewer
  # over D-Bus (llappviewerlinux.cpp, ViewerAppAPI).
  - --own-name=com.secondlife.ViewerAppAPIService
  # Discord status (#205, sldiscordpresence.cpp): Discord's local IPC socket.
  # discord-ipc-0 is a native Discord's socket in $XDG_RUNTIME_DIR (bound only
  # if it exists when we start); the app/ directory is Flatpak Discord's,
  # created if missing so the mount exists even when Discord starts after us.
  - --filesystem=xdg-run/discord-ipc-0
  - --filesystem=xdg-run/app/com.discordapp.Discord:create
  # File pickers (SDL3 dialogs -> FileChooser portal) and web links
  # (SDL_OpenURL / xdg-open -> OpenURI portal) need no extra permissions.

modules:
  - name: slipstream
    buildsystem: simple
    # The release binaries go in exactly as shipped: no stripping, no
    # debuginfo extraction (and no .Debug extension).
    build-options:
      no-debuginfo: true
      strip: false
    sources:
      - type: archive
        path: slipstream.tar.xz
        dest: tree
      - type: file
        path: slipstream-flatpak.sh
      - type: file
        path: org.slipstreamviewer.Slipstream.desktop
      - type: file
        path: org.slipstreamviewer.Slipstream.metainfo.xml
    build-commands:
      - test -x tree/slipstream && test -f tree/build_data.json
      - mkdir -p /app/slipstream
      - cp -a tree/. /app/slipstream/
      # Marks a package install: the wrapper skips the per-user desktop entry,
      # the secondlife:// registration and the missing-library check.
      - echo flatpak > /app/slipstream/.packaged-by
      # Older wrappers set the window class unconditionally; let the launcher's
      # SDL_VIDEO_*_WMCLASS (the app ID) win so the desktop matches the window
      # to this app's icon. A no-op on wrappers that already honour it.
      - sed -i -E 's/^export (SDL_VIDEO_(WAYLAND|X11)_WMCLASS)=\$channel$/export \1="${\1:-$channel}"/' /app/slipstream/slipstream
      # The runtime's Vulkan loader (kept in step with the GL extension that
      # provides the ICDs) instead of the bundled copy.
      - rm -f /app/slipstream/lib/libvulkan.so.1
      # The VLC and example media plugins are unused (GStreamer plays media)
      # and libvlc isn't in the runtime.
      - rm -f /app/slipstream/bin/llplugin/libmedia_plugin_libvlc.so
          /app/slipstream/bin/llplugin/libmedia_plugin_example.so
      - install -Dm755 slipstream-flatpak.sh /app/bin/slipstream
      - install -Dm644 org.slipstreamviewer.Slipstream.desktop -t /app/share/applications
      - install -Dm644 org.slipstreamviewer.Slipstream.metainfo.xml -t /app/share/metainfo
      # Icons: exported files must be named after the app ID.
      - |
        set -e
        cd /app/slipstream/share/icons/hicolor
        for d in */apps; do
          for f in "$d"/slipstream.png "$d"/slipstream.svg; do
            [ -f "$f" ] || continue
            install -Dm644 "$f" "/app/share/icons/hicolor/$d/org.slipstreamviewer.Slipstream.${f##*.}"
          done
        done
        test -f /app/share/icons/hicolor/256x256/apps/org.slipstreamviewer.Slipstream.png
