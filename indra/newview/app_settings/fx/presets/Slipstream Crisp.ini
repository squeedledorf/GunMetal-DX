; Slipstream Crisp -- shipped with Slipstream (bundled SweetFX / prod80 effects only)
PreprocessorDefinitions=
TechniqueSorting=LumaSharpen@LumaSharpen.fx,Vibrance@Vibrance.fx
Techniques=LumaSharpen@LumaSharpen.fx,Vibrance@Vibrance.fx

[LumaSharpen.fx]
sharp_strength=0.500000
sharp_clamp=0.025000
pattern=1
offset_bias=1.000000
show_sharpen=0

[Vibrance.fx]
Vibrance=0.100000
VibranceRGBBalance=1.000000,1.000000,1.000000
